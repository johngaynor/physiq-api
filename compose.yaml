name: physiq-api

services:
  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=physiq_api
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - 5432:5432
    volumes:
      - "${PG_DATA_DIR:-$PWD/postgres_data}:/var/lib/postgresql/18/docker"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d physiq_api"]
      interval: 5s
      retries: 10
      start_period: 20s
      timeout: 5s

  api:
    build: .
    ports:
      - 8000:8000
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database is reachable by service name.
      - DATABASE_URI=postgresql+asyncpg://postgres:postgres@postgres:5432/physiq_api
    volumes:
      # Mount the source so --reload picks up edits without a rebuild.
      - .:/app
    command: >
      sh -c "litestar database upgrade --no-prompt && litestar run --reload --host 0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
